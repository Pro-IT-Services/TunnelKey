name: desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

env:
  WAILS_VERSION: v2.12.0
  WIX_VERSION: 4.0.6

jobs:
  windows:
    runs-on: windows-latest
    # The Azure federated credential trusts this environment (one fixed
    # identity for both manual runs and desktop-v* tags).
    environment: release
    # OIDC token for Azure Artifact Signing (only used when it is configured).
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: go vet / go test
        run: |
          go vet ./...
          go test ./...

      - name: Install Wails and WiX
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          dotnet tool install --global wix --version ${{ env.WIX_VERSION }}
          wix extension add -g WixToolset.UI.wixext/${{ env.WIX_VERSION }}
          wix extension add -g WixToolset.Util.wixext/${{ env.WIX_VERSION }}
          wix extension add -g WixToolset.Bal.wixext/${{ env.WIX_VERSION }}

      # Code signing with Azure Artifact Signing, see docs/windows-code-signing.md.
      # Runs only when the repository variable ARTIFACT_SIGNING_ACCOUNT is set;
      # otherwise the build is unsigned.
      - name: Azure login (code signing)
        if: ${{ vars.ARTIFACT_SIGNING_ACCOUNT != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare code signing
        if: ${{ vars.ARTIFACT_SIGNING_ACCOUNT != '' }}
        shell: pwsh
        run: |
          winget install -e --id Microsoft.Azure.ArtifactSigningClientTools --accept-source-agreements --accept-package-agreements --disable-interactivity
          $metadata = Join-Path $env:RUNNER_TEMP 'artifact-signing.json'
          @{
            Endpoint               = '${{ vars.ARTIFACT_SIGNING_ENDPOINT }}'
            CodeSigningAccountName = '${{ vars.ARTIFACT_SIGNING_ACCOUNT }}'
            CertificateProfileName = '${{ vars.ARTIFACT_SIGNING_PROFILE }}'
            ExcludeCredentials     = @('ManagedIdentityCredential', 'WorkloadIdentityCredential', 'SharedTokenCacheCredential',
                                       'VisualStudioCredential', 'VisualStudioCodeCredential', 'AzurePowerShellCredential',
                                       'AzureDeveloperCliCredential', 'InteractiveBrowserCredential')
          } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8
          "ARTIFACT_SIGNING_METADATA=$metadata" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installers
        shell: powershell
        run: .\scripts\build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: tunnelkey-windows
          path: |
            desktop/build/out/*.msi
            desktop/build/out/*-setup.exe
            desktop/build/out/gpo/
            desktop/build/out/SHA256SUMS.txt
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: go vet / go test
        run: |
          go vet -tags webkit2_41 ./...
          go test -tags webkit2_41 ./...

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build packages
        run: bash scripts/build-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tunnelkey-linux
          path: |
            desktop/build/out/*.deb
            desktop/build/out/*.rpm
            desktop/build/out/SHA256SUMS-linux.txt
          if-no-files-found: error

  macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: go vet / go test
        run: |
          go vet ./...
          go test ./...

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build package (unsigned)
        run: bash scripts/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tunnelkey-macos
          path: |
            desktop/build/out/*.pkg
            desktop/build/out/SHA256SUMS-macos.txt
          if-no-files-found: error
