# Generate the Xcode project with:  xcodegen generate
# Set DEVELOPMENT_TEAM (and, if you fork, the bundle IDs + App Group) below.
name: Tunnelkey
options:
  bundleIdPrefix: app.tunnelkey
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5"
    ENABLE_BITCODE: NO

packages:
  OpenVPNAdapter:
    url: https://github.com/ss-abramchuk/OpenVPNAdapter.git
    exactVersion: 0.8.0

targets:
  Tunnelkey:
    type: application
    platform: iOS
    sources:
      - Tunnelkey
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tunnelkey
        PRODUCT_NAME: Tunnelkey
        INFOPLIST_FILE: Tunnelkey/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tunnelkey/Tunnelkey.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: TunnelkeyTunnel
        embed: true
      - sdk: NetworkExtension.framework

  TunnelkeyTunnel:
    type: app-extension
    platform: iOS
    sources:
      - TunnelkeyTunnel
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tunnelkey.tunnel
        PRODUCT_NAME: TunnelkeyTunnel
        INFOPLIST_FILE: TunnelkeyTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: TunnelkeyTunnel/TunnelkeyTunnel.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: OpenVPNAdapter
      - sdk: NetworkExtension.framework

  TunnelkeyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TunnelkeyTests
        excludes:
          - "*.tunnelkey"
      # Shared test vector (copy of server/testdata/setup_v1.tunnelkey).
      - path: TunnelkeyTests/setup_v1.tunnelkey
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tunnelkey.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tunnelkey

schemes:
  Tunnelkey:
    build:
      targets:
        Tunnelkey: all
    test:
      targets:
        - TunnelkeyTests
